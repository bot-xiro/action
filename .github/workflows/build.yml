name: Build WiFi Login AMR

on:
  push:
    branches: [wifi]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        run: npm install -g pnpm@10.12.4

      - name: Install dependencies
        run: pnpm install -C ./ui

      - name: Package AMR (production quickjs)
        run: pnpm -C ui package

      - name: Collect AMR
        run: |
          mkdir -p out
          find . -name '*.amr' -type f
          find . -name '*.amr' -type f -exec cp -f {} ./out/ \;
          ls -la out/

      - name: Upload AMR artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifi-login-amr
          path: ./out/*.amr
          if-no-files-found: error
          retention-days: 30
