name: Build AMR

# 存储策略 (账号 0.5GB Actions 配额, 私有仓库 artifact 全量计入):
#   - 产物 retention-days: 2 (默认 90 天会迅速吃满配额)
#   - 每次构建后只保留同名产物最新 2 份 (Prune 步骤, 需 actions: write)
#   - probe 探测应用只在 probe/** 变更时构建, 避免每次推送都产出一份
#   - 同分支并发构建自动取消 (省 runner 分钟, 也少一份产物)
on:
  push:
    branches: [main, miniapp]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  changes:
    # 判断本次是否真的动了 probe/ (或手动触发), 决定要不要跑 probe 任务
    runs-on: ubuntu-22.04
    outputs:
      probe: ${{ steps.filter.outputs.probe }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        name: Detect probe changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "probe=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD^ HEAD 2>/dev/null | grep -qE '^(probe/|\.github/workflows/build\.yml)'; then
            echo "probe=true" >> "$GITHUB_OUTPUT"
          else
            echo "probe=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    # ubuntu-22.04: GCC 11.4 (GLIBCXX_3.4.29) + glibc 2.35,
    # 低于设备 libstdc++/libc 上限, 产物可直接加载
    # (ubuntu-latest=24.04 的 GCC13/glibc2.38 会超设备运行时版本)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            cmake \
            make \
          && sudo rm -rf /var/lib/apt/lists/*

      - name: Cross-compile libjsapi_bilinet.so (aarch64)
        run: |
          cmake -B build/native \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_BUILD_TYPE=Release \
            native/bilinet
          cmake --build build/native --config Release --parallel $(nproc)
          mkdir -p ui/libs
          cp -f build/native/libjsapi_bilinet.so ui/libs/libjsapi_bilinet.so
          file ui/libs/libjsapi_bilinet.so
          aarch64-linux-gnu-readelf -h ui/libs/libjsapi_bilinet.so | grep -E 'Class|Machine'
          aarch64-linux-gnu-nm -D ui/libs/libjsapi_bilinet.so | grep custom_init_jsapis

      - name: Install aarch64 GStreamer dev (multiarch)
        run: |
          # arm64 gstreamer/glib 开发包与设备 (gnueabihf=glibc buildroot, gst 1.22) ABI 兼容;
          # Ubuntu jammy 为 glib 2.72/gst 1.20, 基础 API 向下兼容, 运行时链接设备 /usr/lib 同名库
          sudo dpkg --add-architecture arm64
          sudo rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list
          printf '%s\n' \
            'deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse' \
            'deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse' \
            'deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse' | sudo tee /etc/apt/sources.list.d/amd64.list
          printf '%s\n' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse' | sudo tee /etc/apt/sources.list.d/arm64.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libunwind-dev:arm64 libglib2.0-dev:arm64 libgstreamer1.0-dev:arm64 libgstreamer-plugins-base1.0-dev:arm64
          sudo rm -rf /var/lib/apt/lists/*

      - name: Cross-compile libjsapi_gstplayer.so (aarch64)
        env:
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig
        run: |
          cmake -B build/gstplayer \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_BUILD_TYPE=Release \
            native/gstplayer
          cmake --build build/gstplayer --config Release --parallel $(nproc)
          cp -f build/gstplayer/libjsapi_gstplayer.so ui/libs/libjsapi_gstplayer.so
          cp -f build/gstplayer/gstplayerd ui/libs/gstplayerd
          chmod +x ui/libs/gstplayerd
          file ui/libs/libjsapi_gstplayer.so ui/libs/gstplayerd
          aarch64-linux-gnu-readelf -h ui/libs/libjsapi_gstplayer.so | grep -E 'Class|Machine'
          aarch64-linux-gnu-readelf -d ui/libs/libjsapi_gstplayer.so | grep NEEDED
          aarch64-linux-gnu-nm -D ui/libs/libjsapi_gstplayer.so | grep custom_init_jsapis

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install -g pnpm@10.12.4
          pnpm install -C ./ui

      - name: Build AMR (production quickjs)
        run: pnpm -C ui package

      - name: Collect AMR
        run: find . -name '*.amr' -type f

      - name: Upload AMR artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilibilipan-amr
          path: ./ui/*.amr
          if-no-files-found: error
          retention-days: 2

      - name: Prune old artifacts (0.5GB quota)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # 同名产物只保留最新 2 份 (含本次), 其余立刻删除, 避免默认 90 天留存吃满配额
          # 清理失败不影响构建结果 (配额问题不该让产物作废)
          ids=$(gh api "/repos/${{ github.repository }}/actions/artifacts?per_page=100" \
                  --jq '.artifacts | group_by(.name) | map(sort_by(.created_at) | reverse | .[2:]) | flatten | .[].id' || true)
          for id in $ids; do
            gh api -X DELETE "/repos/${{ github.repository }}/actions/artifacts/$id" \
              && echo "pruned artifact $id" || echo "prune failed: $id"
          done
          echo "剩余产物:"
          gh api "/repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | "  \(.name) \(.size_in_bytes/1048576|floor)MB \(.created_at)"' || true

  # 独立探测 app videoprobe (appid 8001812345678999):
  # 跟随 skill media-kms.md 从零实现, 不复用主工程代码, 用于分层/方向可行性确认.
  # 仅在 probe/** 变更或手动触发时构建 (省额度, 也少一份产物).
  probe:
    needs: changes
    if: needs.changes.outputs.probe == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain + aarch64 gstreamer dev
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake make
          sudo dpkg --add-architecture arm64
          sudo rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list
          printf '%s\n' \
            'deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main' \
            'deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main' | sudo tee /etc/apt/sources.list.d/amd64.list
          printf '%s\n' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse' | sudo tee /etc/apt/sources.list.d/arm64.list
          sudo apt-get update
          # libunwind-dev:arm64 是 libgstreamer1.0-dev:arm64 的硬依赖, 缺了会 broken packages
          sudo apt-get install -y --no-install-recommends libunwind-dev:arm64 libglib2.0-dev:arm64 libgstreamer1.0-dev:arm64 libgstreamer-plugins-base1.0-dev:arm64
          sudo rm -rf /var/lib/apt/lists/*

      - name: Cross-compile videoprobe native (aarch64)
        env:
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig
        run: |
          cmake -B build/probe \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_BUILD_TYPE=Release \
            probe
          cmake --build build/probe --config Release --parallel $(nproc)
          mkdir -p probe/ui/libs
          cp -f build/probe/libjsapi_videoprobe.so probe/ui/libs/libjsapi_videoprobe.so
          cp -f build/probe/videoprobed probe/ui/libs/videoprobed
          chmod +x probe/ui/libs/videoprobed
          file probe/ui/libs/libjsapi_videoprobe.so probe/ui/libs/videoprobed
          aarch64-linux-gnu-nm -D probe/ui/libs/libjsapi_videoprobe.so | grep custom_init_jsapis

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with: { node-version: 18 }

      - name: Build probe AMR
        run: |
          npm install -g pnpm@10.12.4
          pnpm install -C probe/ui
          pnpm -C probe/ui package

      - name: Upload probe AMR
        uses: actions/upload-artifact@v4
        with:
          name: videoprobe-amr
          path: ./probe/ui/*.amr
          if-no-files-found: error
          retention-days: 2
