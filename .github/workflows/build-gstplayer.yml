name: Build gstplayer native module

on:
  push:
    branches: [main]
    paths:
      - 'native/gstplayer/**'
  workflow_dispatch:

jobs:
  build-gstplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gstplayer ARM64
        uses: docker/build-push-action@v5
        with:
          context: ./native/gstplayer
          file: ./native/gstplayer/Dockerfile.arm64
          push: false
          load: true
          tags: gstplayer:arm64

      - name: Extract built .so
        run: |
          docker create --name gstplayer-extract gstplayer:arm64
          docker cp gstplayer-extract:/build/build/libjsapi_gstplayer.so ./libs/libjsapi_gstplayer.so
          docker rm gstplayer-extract
          ls -la ./libs/libjsapi_gstplayer.so
          file ./libs/libjsapi_gstplayer.so

      - name: Upload libjsapi_gstplayer.so
        uses: actions/upload-artifact@v4
        with:
          name: libjsapi_gstplayer.so
          path: ./libs/libjsapi_gstplayer.so
          retention-days: 7

  build-miniapp:
    needs: build-gstplayer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download libjsapi_gstplayer.so
        uses: actions/download-artifact@v4
        with:
          name: libjsapi_gstplayer.so
          path: ./libs/

      - name: Setup aiot-vue-cli
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install -g aiot-vue-cli@1.0.32
          npm install

      - name: Build miniapp
        run: npm run build

      - name: Upload miniapp .amr
        uses: actions/upload-artifact@v4
        with:
          name: bilibili.amr
          path: ./*.amr
          retention-days: 7